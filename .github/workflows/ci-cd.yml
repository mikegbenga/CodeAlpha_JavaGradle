name: ci-cd

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ CI
  build:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile, tests, coverage gate, jars)
        run: ./gradlew build -PappVersion=1.0.${{ github.run_number }}

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          p = 'build/reports/jacoco/test/jacocoTestReport.xml'
          if os.path.exists(p):
              r = ET.parse(p).getroot()
              print('### Test coverage\n\n| Counter | Covered |\n|---|---|')
              for c in r.findall('counter'):
                  m, cv = int(c.get('missed')), int(c.get('covered'))
                  print(f"| {c.get('type').title()} | {100*cv/(m+cv):.1f}% |")
          EOF

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-all.jar

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html

  # ------------------------------------------------------------------ CD: container image
  docker:
    name: Docker image → GHCR
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/codealpha-task-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=1.0.${{ github.run_number }}
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker run -d --name api -p 8080:8080 "$IMAGE:1.0.${{ github.run_number }}"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then echo; break; fi
            sleep 2
          done
          curl -fsS -X POST -d '{"title":"smoke test"}' http://localhost:8080/api/tasks
          echo
          curl -fsS http://localhost:8080/health | grep -q '"version":"1.0.${{ github.run_number }}"'
          docker logs api

  # ------------------------------------------------------------------ CD: release on tag
  release:
    name: GitHub Release
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - uses: softprops/action-gh-release@v2
        with:
          files: '*-all.jar'
          generate_release_notes: true
